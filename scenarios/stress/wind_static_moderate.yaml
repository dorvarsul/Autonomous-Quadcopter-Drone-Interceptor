# Static intercept under a moderate steady breeze + gentle gusts. Isolates control-loop
# robustness: the disturbance force pushes the airframe, so the limiter/PID must hold the
# intercept without blowing the saturation or miss KPIs.
name: wind_static_moderate
seed: 0
target_class: static
guidance_law: OGL
time_limit_s: 12.0
wind_preset: moderate
interceptor:
  start_m: [0.0, 0.0, 2.0]
target:
  type: static
  position_m: [10.0, 3.0, 6.0]
