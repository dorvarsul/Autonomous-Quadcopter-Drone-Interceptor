# Constant-velocity crossing target intercepted under gusty wind: combines a moving lead
# problem with a strong disturbance so guidance and control are stressed together. Phase 4 T4.3.
name: wind_linear_gusty
seed: 0
target_class: moving
guidance_law: OGL
time_limit_s: 18.0
wind_preset: gusty
interceptor:
  start_m: [0.0, 0.0, 2.0]
target:
  type: linear
  start_position_m: [9.0, -5.0, 5.0]
  velocity_m_s: [0.0, 2.0, 0.0]
